# Per-model import corrections (ADR-030), read by the sandbox at startup.
# One [stem] section per model file in this folder:
#   scale  = 0.01          uniform; e.g. centimetre packs -> metres
#   rotate = -90 0 0       degrees, X then Y then Z (e.g. Z-up packs)
#   hide   = NodeA, NodeB  node names whose meshes are not imported
# The load log prints every model's bounds after the correction.

# KayKit Adventurers "Knight" (CC0, Kay Lousberg; see docs/ASSET_SOURCES.md).
# Authored ~2.5 m tall; 0.65 makes a ~1.6 m figure beside the 1.8 m player.
# The file carries every accessory variant parented to the hand slots;
# keep one sword and one shield.
[knight]
scale = 0.65
hide = 1H_Sword_Offhand, Badge_Shield, Rectangle_Shield, Spike_Shield, 2H_Sword

