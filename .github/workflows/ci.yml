name: CI

on:
  push:
    branches: [main, upgrade-pass]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tree does not yet conform to .clang-format (known debt), so this job
  # reports but does not gate. Flip continue-on-error to false once the tree
  # has been reformatted.
  format:
    name: format (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format
      - name: Check formatting
        run: |
          find engine sandbox \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format -n --Werror

  # Cheap CPU-only checks: Python tools compile, Lua scripts parse.
  lint:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile tools/*.py tools/dev/*.py
      - name: Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          fail=0
          for f in $(find assets tools -name '*.lua'); do
            luac5.4 -p "$f" || { echo "syntax error: $f"; fail=1; }
          done
          exit $fail

  # Build-only. There is no GPU on hosted runners, so the game is never
  # launched on Windows/macOS (it would open a window, fail Vulkan setup or
  # loop forever). Linux runs a headless smoke test, bounded by `timeout`.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # FetchContent clones (Jolt, assimp, ...) and their objects live in the
      # build tree; restoring it makes warm runs incremental.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build/release
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'engine/CMakeLists.txt', 'sandbox/CMakeLists.txt') }}
          restore-keys: build-${{ runner.os }}-

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release -j 4

      # Headless smoke: exit 0, or exit 1 with the graceful "glfwInit failed".
      - name: Smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: bash ci/run_sandbox.sh
